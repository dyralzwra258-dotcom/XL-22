<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XL22</title>

<style>
*{
box-sizing:border-box;
font-family:Tahoma,Arial;
}

body{
margin:0;
min-height:100vh;
background:#0b0b0b;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.box{
width:90%;
max-width:400px;
background:#151515;
padding:30px 25px;
border-radius:20px;
border:1px solid #d4af37;
box-shadow:0 0 25px #000;
}

.logo{
text-align:center;
font-size:40px;
font-weight:bold;
color:#d4af37;
margin-bottom:15px;
}

h2{
text-align:center;
color:#ddd;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #555;
background:#222;
color:white;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:0;
border-radius:10px;
background:#d4af37;
font-weight:bold;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#f1cc54;
}

a{
display:block;
text-align:center;
margin-top:20px;
color:#d4af37;
cursor:pointer;
}

.hidden{
display:none;
}

.msg{
text-align:center;
margin-top:15px;
color:#d4af37;
}

</style>
</head>

<body>


<!-- تسجيل الدخول -->

<div class="box" id="login">

<div class="logo">XL22</div>

<h2>تسجيل الدخول</h2>

<input id="loginUser" placeholder="رقم الهاتف أو البريد">

<input id="loginPass" type="password" placeholder="كلمة المرور">


<button onclick="login()">
دخول
</button>


<a onclick="showRegister()">
إنشاء حساب جديد
</a>


<div class="msg" id="loginMsg"></div>

</div>



<!-- إنشاء حساب -->

<div class="box hidden" id="register">

<div class="logo">XL22</div>

<h2>إنشاء حساب</h2>


<input id="newUser" placeholder="رقم الهاتف أو البريد">

<input id="newPass" type="password" placeholder="كلمة المرور">


<input id="invite" placeholder="كود الدعوة">


<button onclick="register()">
تسجيل
</button>


<a onclick="showLogin()">
لدي حساب بالفعل
</a>


<div class="msg" id="regMsg"></div>

</div>




<script>

function showRegister(){

document.getElementById("login").classList.add("hidden");

document.getElementById("register").classList.remove("hidden");

}


function showLogin(){

document.getElementById("register").classList.add("hidden");

document.getElementById("login").classList.remove("hidden");

}



function register(){

let user=document.getElementById("newUser").value;
let pass=document.getElementById("newPass").value;
let invite=document.getElementById("invite").value;


if(user=="" || pass==""){
document.getElementById("regMsg").innerHTML="أكمل البيانات";
return;
}


// حفظ المستخدم مؤقتا في المتصفح

localStorage.setItem("XL22_user",user);
localStorage.setItem("XL22_pass",pass);
localStorage.setItem("XL22_invite",invite);


document.getElementById("regMsg").innerHTML="تم إنشاء الحساب بنجاح";

setTimeout(showLogin,1000);

}



function login(){

let user=document.getElementById("loginUser").value;
let pass=document.getElementById("loginPass").value;


if(
user==localStorage.getItem("XL22_user")
&&
pass==localStorage.getItem("XL22_pass")
){

alert("تم الدخول بنجاح");

}else{

document.getElementById("loginMsg").innerHTML=
"بيانات الدخول غير صحيحة";

}

}


</script>

</body>
</html>
