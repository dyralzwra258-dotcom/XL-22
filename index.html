<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XL22 - تسجيل الدخول</title>

<style>
*{
    box-sizing:border-box;
    font-family:Tahoma, Arial, sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:90%;
    max-width:400px;
    background:#151515;
    border-radius:20px;
    padding:35px 25px;
    box-shadow:0 0 30px rgba(212,175,55,.25);
    border:1px solid rgba(212,175,55,.3);
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    color:#d4af37;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:35px;
}

.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    color:#d4af37;
}

.input-box input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #444;
    background:#222;
    color:white;
    outline:none;
    font-size:16px;
}

.input-box input:focus{
    border-color:#d4af37;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#d4af37;
    color:#000;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#f0c94d;
}

.links{
    text-align:center;
    margin-top:25px;
}

.links a{
    color:#d4af37;
    text-decoration:none;
    display:block;
    margin-top:10px;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#777;
    font-size:13px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        XL22
    </div>

    <div class="subtitle">
        تسجيل الدخول إلى الحساب
    </div>


    <div class="input-box">
        <label>رقم الهاتف أو البريد</label>
        <input type="text" placeholder="أدخل البيانات">
    </div>


    <div class="input-box">
        <label>كلمة المرور</label>
        <input type="password" placeholder="أدخل كلمة المرور">
    </div>


    <button>
        دخول
    </button>


    <div class="links">
        <a href="#">إنشاء حساب جديد</a>
        <a href="#">نسيت كلمة المرور؟</a>
    </div>


    <div class="footer">
        © 2026 XL22 جميع الحقوق محفوظة
    </div>

</div>


</body>
</html>
